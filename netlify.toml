# ==============================================================================
# Netlify Configuration for Parity
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/
# ==============================================================================

[build]
  # Publish directory containing index.html and static assets
  publish = "."

  # Command to run before deployment to generate production script bundles
  command = "npm run build"

[build.environment]
  # Ensure modern Node.js runtime
  NODE_VERSION = "20"
  NPM_FLAGS = "--omit=dev"

# ------------------------------------------------------------------------------
# Security & Performance Headers
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Allow game embedding if needed while protecting against clickjacking
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static script bundles
[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache stylesheets
[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache icons
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Always revalidate index.html and story data so updates are instant
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/story.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ------------------------------------------------------------------------------
# SPA Redirects
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
